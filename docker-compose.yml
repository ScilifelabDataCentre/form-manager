services:
  db:
    profiles:
      - dev
      - testing
    image: mongo:latest
    command: --quiet --logpath /dev/null  # comment the following line if you want output from the database
    volumes:
      - mongo-data:/data/
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=mongopassword

  backend:
    profiles:
      - dev
    build:
      context: ./
      dockerfile: Dockerfiles/Dockerfile.backend
    entrypoint: flask run
    environment:
      FLASK_DEBUG: 1
      DEV_LOGIN: 1
      TZ: Europe/Stockholm
    depends_on:
      - db
    restart: on-failure
    volumes:
      - type: bind
        source: ./src/form_manager
        target: /app/form_manager

  frontend:
    profiles:
      - dev
    build:
      context: ./
      dockerfile: Dockerfiles/Dockerfile.frontend
      target: dev
    restart: on-failure
    environment:
      VERSION: "dev"
    volumes:
      - type: bind
        source: ./frontend/src
        target: /code/src

  proxy:
    profiles:
      - dev
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - 127.0.0.1:5050:8080
    depends_on:
      - backend
      - frontend
      - db
    volumes:
      - type: bind
        source: ./Dockerfiles/nginx.conf.dev
        target: /etc/nginx/conf.d/default.conf

  test:
    profiles:
      - testing
    build:
      context: ./
      dockerfile: Dockerfiles/Dockerfile.backend
      target: test
    command: sh -c "pytest --color=yes --cov=./ --cov-report=xml:./tests/coverage/report.xml tests/"
    environment:
      DEV_LOGIN: 1
    depends_on:
      - db
    restart: "no"
    volumes:
      - type: bind
        source: ./src/form_manager
        target: /app/form_manager

  mailcatcher:
    profiles:
      - dev
    image: sj26/mailcatcher:latest
    ports:
      - 127.0.0.1:1080:1080

volumes:
  mongo-data: {}
